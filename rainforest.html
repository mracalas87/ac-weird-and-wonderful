<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rainforest Rangers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Make the hidden attribute always win, so closed items stay closed on a normal website */
[hidden] { display: none !important; }

:root{--ink:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:#06241a}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);padding:24px 16px;background:radial-gradient(ellipse at 50% 0%,#1d7a49 0,#0b3a28 55%,#04180f 100%);overflow-x:hidden;position:relative}
.logo{position:fixed;left:12px;top:12px;width:104px;border-radius:12px;border:3px solid #9be3a6;background:#fff}
h1{margin:0;font-size:clamp(38px,7vw,72px);font-weight:700;text-align:center;text-shadow:0 0 24px rgba(120,255,150,.55);line-height:1.05}
.sub{margin:0;font-size:clamp(17px,2.4vw,24px);opacity:.92;text-align:center;max-width:620px}
.cards{display:flex;gap:clamp(16px,3vw,34px);flex-wrap:wrap;justify-content:center;width:100%}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:min(92vw,340px);min-height:300px;padding:22px;border-radius:32px;color:#fff;text-decoration:none;text-align:center;border:5px solid rgba(255,255,255,.85);box-shadow:0 14px 0 rgba(0,0,0,.28),0 20px 44px rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.card:hover{transform:translateY(-6px) scale(1.02)}
.card:active{transform:translateY(6px);box-shadow:0 6px 0 rgba(0,0,0,.28)}
.fire{background:linear-gradient(160deg,#ff9a1f,#e4380f 70%,#a81d08)}
.look{background:linear-gradient(160deg,#4fd37a,#14867f 70%,#0b5a63)}
.ico{font-size:clamp(84px,14vw,128px);line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));animation:bob 2.6s ease-in-out infinite}
.look .ico{animation-delay:-1.3s}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.card b{font-size:clamp(26px,4vw,34px);font-weight:700;line-height:1.1}
.card span{font-size:clamp(16px,2.2vw,20px);opacity:.95}
.go{margin-top:6px;background:#fff;color:#1b5e33;border-radius:999px;padding:8px 26px;font-size:21px;font-weight:700}
.fire .go{color:#a81d08}
.fly{position:fixed;width:8px;height:8px;border-radius:50%;background:#d9ff8a;box-shadow:0 0 12px 4px rgba(217,255,138,.6);opacity:0;animation:fly 7s linear infinite;pointer-events:none}
@keyframes fly{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-120px) translateX(30px)}}
.credit{opacity:.6;font-size:14px;margin-top:4px}
@media (max-width:620px){.logo{position:static;width:84px}}
@media (prefers-reduced-motion:reduce){.ico,.fly{animation:none}}
</style></head><body>
